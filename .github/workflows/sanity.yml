name: sanity check

on:
  push:
  pull_request:

jobs:
  run_sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Run IPv4 and IPv6 as two parallel jobs on separate runners. Each runner
    # is its own ephemeral VM, so their rawsock endpoints never share an
    # interface.
    strategy:
      fail-fast: false
      matrix:
        family: [ipv4, ipv6]
    steps:
      - name: Check out the code
        uses: actions/checkout@v3

      - name: Install bridge-utils
        run: |
          sudo apt update
          sudo apt install -y iproute2 bridge-utils

      - name: Create VETH Interfaces
        run: |
          sudo ip link add dev vm1 type veth peer name vm2
          sudo ip link set dev vm1 up

      - name: Create the Bridge
        run: |
          sudo ip tuntap add tapm mode tap
          sudo ip link set dev tapm up
          sudo ip link add brm type bridge

      - name: Bring the Bridge Up
        run: |
          sudo ip link set tapm master brm
          sudo ip link set vm1 master brm
          sudo ip addr add 10.1.0.1/24 dev brm
          sudo ip addr add 10.1.0.2/24 dev vm2
          # IPv6: ensure it is enabled, then assign ULA addresses. 'nodad'
          # skips Duplicate Address Detection so the addresses are usable
          # immediately instead of sitting "tentative" for ~1s.
          sudo sysctl -w net.ipv6.conf.brm.disable_ipv6=0
          sudo sysctl -w net.ipv6.conf.vm2.disable_ipv6=0
          sudo ip -6 addr add fd00:1::1/64 dev brm nodad
          sudo ip -6 addr add fd00:1::2/64 dev vm2 nodad
          sudo ip link set brm up
          sudo ip link set vm2 up

      - name: Bring the libfabric up
        run: |
          cd ..
          wget https://github.com/ofiwg/libfabric/releases/download/v1.20.1/libfabric-1.20.1.tar.bz2
          tar -jxvf libfabric-1.20.1.tar.bz2
          ln -s libfabric-1.20.1 libfabric
          cd libfabric
          autoreconf
          ./configure
          make -j

      - name: Compile uet-ref-prov
        run: |
          make
          make provider provider-smoke

      - name: Check network brm to vm
        run: |
          ping -c1 10.1.0.2
          ping -I 10.1.0.1 -c1 10.1.0.2
          ping -6 -c1 fd00:1::2
          ping -6 -I fd00:1::1 -c1 fd00:1::2
          arp -a

      - name: Check network vm to brm
        run: |
          ping -c1 10.1.0.1
          ping -I 10.1.0.2 -c1 10.1.0.1
          ping -6 -c1 fd00:1::1
          ping -6 -I fd00:1::2 -c1 fd00:1::1
          arp -a

      - name: Add ip addresses to arp table
        run: |
          ip link show brm | awk '/link\/ether/ {print $2}'
          ip link show vm2 | awk '/link\/ether/ {print $2}'
          MAC1=$(ip link show vm2 | awk '/link\/ether/ {print $2}')
          MAC2=$(ip link show brm | awk '/link\/ether/ {print $2}')

          echo "Discovered MAC2 Address: $MAC2"
          echo "Discovered MAC2 Address: $MAC1"
          sudo arp -i vm2 -s 10.1.0.1 $MAC2
          sudo arp -i brm -s 10.1.0.2 $MAC1

          # IPv6 equivalent of the static ARP entries above: install
          # permanent neighbor (NDP) cache entries in both directions.
          sudo ip -6 neigh add fd00:1::1 lladdr $MAC2 dev vm2 nud permanent
          sudo ip -6 neigh add fd00:1::2 lladdr $MAC1 dev brm nud permanent

      - name: Validate the external libfabric provider
        run: |
          set -euo pipefail
          provider_env=(
            FI_PROVIDER_PATH="$PWD"
            LD_LIBRARY_PATH="$PWD:../libfabric/src/.libs"
            UET_NIC_SHIM=rawsock
          )

          env "${provider_env[@]}" ../libfabric/util/fi_info -p uet
          if [ "${{ matrix.family }}" = ipv6 ]; then
            smoke_addr=fd00:1::1
          else
            smoke_addr=10.1.0.1
          fi
          sudo env "${provider_env[@]}" UET_IFNAME=brm \
            ./uet_provider_smoke "$smoke_addr"

          server_pid=
          cleanup() {
            if [ -n "$server_pid" ]; then
              sudo kill "$server_pid" 2>/dev/null || true
            fi
            sudo ip netns del uet-fi-provider-a 2>/dev/null || true
            sudo ip netns del uet-fi-provider-b 2>/dev/null || true
          }
          trap cleanup EXIT

          sudo ip netns add uet-fi-provider-a
          sudo ip netns add uet-fi-provider-b
          sudo ip link add uet-fi-a type veth peer name uet-fi-b
          sudo ip link set uet-fi-a netns uet-fi-provider-a
          sudo ip link set uet-fi-b netns uet-fi-provider-b
          sudo ip -n uet-fi-provider-a addr add 192.0.2.1/24 dev uet-fi-a
          sudo ip -n uet-fi-provider-b addr add 192.0.2.2/24 dev uet-fi-b
          sudo ip -n uet-fi-provider-a link set lo up
          sudo ip -n uet-fi-provider-b link set lo up
          sudo ip -n uet-fi-provider-a link set uet-fi-a up
          sudo ip -n uet-fi-provider-b link set uet-fi-b up

          timeout 30 sudo ip netns exec uet-fi-provider-a \
            env "${provider_env[@]}" UET_IFNAME=uet-fi-a \
            ../libfabric/util/fi_pingpong -p uet -e rdm -m msg \
            -I 100 -S 1024 -c &
          server_pid=$!
          sleep 2
          timeout 30 sudo ip netns exec uet-fi-provider-b \
            env "${provider_env[@]}" UET_IFNAME=uet-fi-b \
            ../libfabric/util/fi_pingpong -p uet -e rdm -m msg \
            -I 100 -S 1024 -c 192.0.2.1
          wait "$server_pid"
          server_pid=

      # Suite via scripts/uet_test.sh, which sets each mode's env (security
      # modes, SSI, ack_cc, timeouts) and auto-discovers ../libfabric. One
      # PDS-cell/test per loop iteration keeps the server (background) and
      # client (foreground) in sync; uet_test.sh exits non-zero on failure.
      # NOTE: uet_test.sh runs `sudo` internally.
      # 6 cells x 5 tests = 30 runs, for this job's address family.
      - name: run suite via uet_test.sh (${{ matrix.family }})
        run: |
          if [ "${{ matrix.family }}" = ipv6 ]; then
            ip -6 neigh
            srv_peer=fd00:1::2; cli_peer=fd00:1::1
          else
            arp -a
            srv_peer=10.1.0.2; cli_peer=10.1.0.1
          fi
          for pds in pds pds_cluster pds_server_ssi \
                     pds_cluster_1rtt pds_cluster_churn pds_cluster_interop; do
            for t in rudi uud rma tag atomic; do
              echo "::group::${{ matrix.family }} $pds/$t"
              ./scripts/uet_test.sh server brm "$srv_peer" "$t" "$pds" &
              srv=$!
              sleep 2
              ./scripts/uet_test.sh client vm2 "$cli_peer" "$t" "$pds"
              wait $srv
              echo "::endgroup::"
            done
          done
